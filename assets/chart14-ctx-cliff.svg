<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <rect x="1" y="1" width="878" height="428" fill="none" stroke="#d0d7de" rx="10"/>

  <text x="30" y="38" font-size="19" font-weight="700" fill="#1f2328">Context cliff: flat up to 176K, knife-edge, then VRAM spill</text>
  <text x="30" y="60" font-size="12.5" fill="#57606a">decode tok/s vs context size - server-timed, reverse-order re-runs to exclude thermal drift. b11223, MTP d3, single stream.</text>

  <!-- zones -->
  <rect x="100" y="80" width="386" height="240" fill="#dafbe1" opacity="0.45"/>
  <rect x="486" y="80" width="65" height="240" fill="#fff8c5" opacity="0.7"/>
  <rect x="551" y="80" width="279" height="240" fill="#ffebe9" opacity="0.6"/>
  <text x="270" y="98" font-size="11.5" font-weight="700" fill="#1a7f37">STABLE ZONE - no speed cost</text>
  <text x="518" y="98" font-size="11" font-weight="700" fill="#7d4e00" text-anchor="middle">KNIFE</text>
  <text x="518" y="112" font-size="11" font-weight="700" fill="#7d4e00" text-anchor="middle">EDGE</text>
  <text x="690" y="98" font-size="11.5" font-weight="700" fill="#cf222e">VRAM SPILL ZONE</text>

  <!-- gridlines -->
  <g stroke="#eaeef2" stroke-width="1">
    <line x1="100" y1="320" x2="830" y2="320"/>
    <line x1="100" y1="266.7" x2="830" y2="266.7"/>
    <line x1="100" y1="213.3" x2="830" y2="213.3"/>
    <line x1="100" y1="160" x2="830" y2="160"/>
    <line x1="100" y1="106.7" x2="830" y2="106.7"/>
  </g>
  <g font-size="11" fill="#57606a" text-anchor="end">
    <text x="92" y="324">40</text>
    <text x="92" y="270.7">50</text>
    <text x="92" y="217.3">60</text>
    <text x="92" y="164">70</text>
    <text x="92" y="110.7">80</text>
  </g>
  <text x="40" y="200" font-size="12" fill="#57606a" transform="rotate(-90 40 200)">decode tok/s</text>

  <!-- x tick labels -->
  <g font-size="11" fill="#57606a" text-anchor="middle">
    <text x="100" y="340">96K</text>
    <text x="271.8" y="340">128K</text>
    <text x="400.6" y="340">152K</text>
    <text x="443.6" y="340">160K</text>
    <text x="486.5" y="340">168K</text>
    <text x="529.4" y="340">176K</text>
    <text x="572.4" y="340">184K</text>
    <text x="615.3" y="340">192K</text>
    <text x="787" y="340">224K</text>
  </g>
  <text x="465" y="366" font-size="12" fill="#57606a" text-anchor="middle">context size (K tokens = x1024)</text>

  <!-- data polyline (solid through stable zone, dashed in spill) -->
  <polyline points="100,144 271.8,132.8 400.6,151.5 443.6,149.3 486.5,137.6" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <polyline points="572.4,197.9 615.3,258.3 787,239" fill="none" stroke="#cf222e" stroke-width="2.5" stroke-dasharray="6,4"/>
  <line x1="486.5" y1="137.6" x2="572.4" y2="197.9" stroke="#0969da" stroke-width="2.5" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- data points -->
  <g fill="#0969da" stroke="#ffffff" stroke-width="1.5">
    <circle cx="100" cy="144" r="5"/>
    <circle cx="271.8" cy="132.8" r="5"/>
    <circle cx="400.6" cy="151.5" r="5"/>
    <circle cx="486.5" cy="137.6" r="5"/>
  </g>
  <g fill="#cf222e" stroke="#ffffff" stroke-width="1.5">
    <circle cx="572.4" cy="197.9" r="5"/>
    <circle cx="615.3" cy="258.3" r="5"/>
    <circle cx="787" cy="239" r="5"/>
  </g>

  <!-- 176K knife edge: hollow + error bar -->
  <line x1="529.4" y1="152" x2="529.4" y2="232" stroke="#7d4e00" stroke-width="1.5"/>
  <line x1="522" y1="152" x2="537" y2="152" stroke="#7d4e00" stroke-width="1.5"/>
  <line x1="522" y1="232" x2="537" y2="232" stroke="#7d4e00" stroke-width="1.5"/>
  <circle cx="529.4" cy="197.9" r="5" fill="#ffffff" stroke="#7d4e00" stroke-width="2"/>
  <text x="545" y="248" font-size="11.5" fill="#7d4e00">bimodal: 74.7 vs 55-59</text>
  <text x="545" y="264" font-size="11.5" fill="#7d4e00">across launches</text>

  <!-- spill annotation -->
  <text x="640" y="290" font-size="12" font-weight="700" fill="#cf222e">VRAM spill: -25%</text>
  <text x="640" y="306" font-size="11.5" fill="#57606a">KV buffer exceeds 24GB,</text>
  <text x="640" y="321" font-size="11.5" fill="#57606a">pages demote to system RAM</text>

  <!-- 160K star -->
  <path d="M 443.6 118 l 3.2 6.6 7.3 1.1 -5.3 5.1 1.3 7.2 -6.5 -3.4 -6.5 3.4 1.3 -7.2 -5.3 -5.1 7.3 -1.1 z" fill="#bf8700"/>
  <text x="443.6" y="112" font-size="12.5" font-weight="700" fill="#7d4e00" text-anchor="middle">160K - recommended (max stable)</text>
</svg>
